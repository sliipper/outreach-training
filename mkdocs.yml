site_name: Physics Outreach Training & Resources
theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
    - scheme: slate
      primary: indigo
      accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - search.highlight

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
      smart_dollar: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Training:
    - Overview: training/index.md
    - Safety Protocols: training/safety.md
    - Communication Tips: training/communication.md
  - Resources:
    - Overview: resources/index.md
    - Physics Demos: resources/demos.md
    - Lesson Plans: resources/lessons.md
